<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Loan</title>
    <link rel="icon" type="image/jpeg" href="/assets/images/aviah.jpg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style/app.css" />
  </head>
  <body class="min-h-screen bg-slate-100">
    <div class="min-h-screen md:flex">
      <!-- Sidebar / Topbar -->
      <app-sidebar></app-sidebar>

      <!-- Main -->
      <main class="flex-1 p-5 md:p-10">
        <div class="mx-auto w-full max-w-2xl">
          <h1 class="text-2xl font-bold text-violet-800">Create New Loan</h1>
          <p class="mt-1 text-sm text-slate-500">Fill in the details to create a new loan entry</p>

          <form id="createLoanForm" class="mt-6 space-y-4">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <label class="text-xs font-semibold text-slate-700">Borrower Name</label>
              <input name="borrowerName" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-violet-400" placeholder="Enter borrower name" required />
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <label class="text-xs font-semibold text-slate-700">Loan Amount</label>
              <input name="amount" inputmode="decimal" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-violet-400" placeholder="0.00" required />
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <label class="text-xs font-semibold text-slate-700">Interest Rate (%)</label>
              <input id="interestRate" name="interestRate" inputmode="decimal" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-violet-400" placeholder="0.0" required />
              <div class="mt-3 grid grid-cols-3 gap-2">
                <button type="button" class="rounded-lg bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-200" data-rate="10">10%</button>
                <button type="button" class="rounded-lg bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-200" data-rate="20">20%</button>
                <button type="button" class="rounded-lg bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-200" data-rate="30">30%</button>
              </div>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <label class="text-xs font-semibold text-slate-700">Due Date</label>
              <input name="dueDate" type="date" class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-violet-400" required />
            </div>

            <button type="submit" class="w-full rounded-2xl bg-violet-800 px-6 py-4 text-sm font-bold text-white shadow-sm hover:bg-violet-900">
              Create Loan
            </button>
          </form>
        </div>
      </main>
    </div>

    <script type="module" src="/scripts/pages/create.js"></script>
  </body>
</html>
