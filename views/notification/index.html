<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications</title>
    <link rel="icon" type="image/jpeg" href="/assets/images/aviah.jpg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style/app.css" />
  </head>
  <body class="min-h-screen bg-slate-100">
    <div class="min-h-screen md:flex">
      <app-sidebar></app-sidebar>

      <main class="flex-1 p-5 md:p-10">
        <div class="mx-auto w-full max-w-3xl">
          <h1 class="text-2xl font-bold text-violet-800">Notifications</h1>
          <p class="mt-1 text-sm text-slate-500">Triggers when a loan is 1 day left before due date</p>

          <div class="mt-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="text-xs font-semibold text-slate-500">Near Due (1 day left)</div>
            <div id="nearDueCount" class="mt-1 text-2xl font-extrabold text-amber-700">0</div>
          </div>

          <div id="notificationsList" class="mt-5 space-y-4"></div>
        </div>
      </main>
    </div>

    <script type="module" src="/scripts/pages/notifications.js"></script>
  </body>
</html>
