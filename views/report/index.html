<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/aviah.jpg" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style/app.css" />
</head>

<body class="min-h-screen bg-slate-100">
  <div class="min-h-screen md:flex">
    <app-sidebar></app-sidebar>

    <main class="flex-1 p-5 md:p-10">
      <div class="mx-auto w-full max-w-3xl">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-bold text-violet-800">Report</h1>
          <button id="exportCsvBtn" type="button"
            class="flex items-center gap-2 rounded-xl bg-violet-800 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-600">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
              <path fill-rule="evenodd"
                d="M4.25 5.5a.75.75 0 00-.75.75v8.5c0 .414.336.75.75.75h8.5a.75.75 0 00.75-.75v-4a.75.75 0 011.5 0v4A2.25 2.25 0 0112.75 17h-8.5A2.25 2.25 0 012 14.75v-8.5A2.25 2.25 0 014.25 4h5a.75.75 0 010 1.5h-5z"
                clip-rule="evenodd" />
              <path fill-rule="evenodd"
                d="M6.194 12.753a.75.75 0 001.06.053L16.5 4.44v2.81a.75.75 0 001.5 0v-4.5a.75.75 0 00-.75-.75h-4.5a.75.75 0 000 1.5h2.553l-9.056 8.194a.75.75 0 00-.053 1.06z"
                clip-rule="evenodd" />
            </svg>
            Export CSV
          </button>
        </div>

        <div class="mt-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-center gap-2 text-xs font-semibold text-slate-700">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
              class="h-4 w-4 text-violet-700">
              <path fill-rule="evenodd"
                d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v1h16V7a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zM18 9H2v7a2 2 0 002 2h12a2 2 0 002-2V9z"
                clip-rule="evenodd" />
            </svg>
            Filter by Creation Date
          </div>

          <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
            <div>
              <div class="text-[11px] text-slate-500">From</div>
              <input id="fromDate" type="date"
                class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm outline-none focus:border-violet-400" />
            </div>
            <div>
              <div class="text-[11px] text-slate-500">To</div>
              <input id="toDate" type="date"
                class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm outline-none focus:border-violet-400" />
            </div>
          </div>

          <div class="mt-2 text-[11px] text-slate-500">Showing <span id="showingCount">0</span> loan(s)</div>
        </div>

        <div class="mt-5 space-y-4">
          <div class="grid grid-cols-1 gap-4">
            <section class="rounded-2xl bg-violet-800 p-6 text-white shadow-sm">
              <div class="flex items-start justify-between gap-3">
                <div class="w-full">
                  <div class="text-[18px] text-white font-bold">ACTIVE LOANS</div>

                  <div class="mt-4 flex items-center justify-between">
                    <div class="text-sm font-semibold">Total Released</div>
                    <div id="activeReleased" class="text-xl font-bold">₱0.00</div>
                  </div>

                  <div class="mt-2 flex items-center justify-between">
                    <div class="text-sm font-semibold text-fuchsia-300">Total Accumulated</div>
                    <div id="activeAccumulated" class="text-xl font-bold text-fuchsia-300">₱0.00</div>
                  </div>

                  <div class="mt-4 rounded-2xl bg-white/10 p-3 text-sm">
                    <div class="flex items-center justify-between">
                      <div class="text-xs text-white/70">Principal</div>
                      <div id="activePrincipalBreakdown" class="text-xs font-semibold">₱0.00</div>
                    </div>
                    <div class="mt-1 flex items-center justify-between">
                      <div class="text-xs text-white/70">Interest</div>
                      <div id="activeInterestBreakdown" class="text-xs font-semibold">₱0.00</div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section class="rounded-2xl bg-fuchsia-800 p-6 text-white shadow-sm">
              <div class="flex items-start justify-between gap-3">
                <div class="w-full">
                  <div class="text-[18px] text-white font-bold">PAID LOANS</div>

                  <div class="mt-4 flex items-center justify-between">
                    <div class="text-sm font-semibold">Total Released</div>
                    <div id="paidReleased" class="text-xl font-bold">₱0.00</div>
                  </div>

                  <div class="mt-2 flex items-center justify-between">
                    <div class="text-sm font-semibold text-violet-300">Total Accumulated</div>
                    <div id="paidAccumulated" class="text-xl font-bold text-violet-300">₱0.00</div>
                  </div>

                  <div class="mt-4 rounded-2xl bg-white/10 p-3 text-sm">
                    <div class="flex items-center justify-between">
                      <div class="text-xs text-white/70">Principal</div>
                      <div id="paidPrincipalBreakdown" class="text-xs font-semibold">₱0.00</div>
                    </div>
                    <div class="mt-1 flex items-center justify-between">
                      <div class="text-xs text-white/70">Interest</div>
                      <div id="paidInterestBreakdown" class="text-xs font-semibold">₱0.00</div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>

          <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <div id="reportChartPanel"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/scripts/pages/report.js"></script>
</body>

</html>
