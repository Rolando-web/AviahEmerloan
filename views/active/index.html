<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Active Loans</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/aviah.jpg" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style/app.css" />
</head>

<body class="min-h-screen bg-slate-100">
  <div class="min-h-screen md:flex">
    <app-sidebar></app-sidebar>

    <main class="flex-1 p-5 md:p-10">
      <div class="mx-auto w-full max-w-3xl">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-bold text-violet-800">Active Loans</h1>
          <button id="exportCsvBtn" type="button"
            class="flex items-center gap-2 rounded-xl bg-violet-800 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-600">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
              <path fill-rule="evenodd"
                d="M4.25 5.5a.75.75 0 00-.75.75v8.5c0 .414.336.75.75.75h8.5a.75.75 0 00.75-.75v-4a.75.75 0 011.5 0v4A2.25 2.25 0 0112.75 17h-8.5A2.25 2.25 0 012 14.75v-8.5A2.25 2.25 0 014.25 4h5a.75.75 0 010 1.5h-5z"
                clip-rule="evenodd" />
              <path fill-rule="evenodd"
                d="M6.194 12.753a.75.75 0 001.06.053L16.5 4.44v2.81a.75.75 0 001.5 0v-4.5a.75.75 0 00-.75-.75h-4.5a.75.75 0 000 1.5h2.553l-9.056 8.194a.75.75 0 00-.053 1.06z"
                clip-rule="evenodd" />
            </svg>
            Export CSV
          </button>
        </div>

        <div class="mt-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <div class="flex items-center justify-between gap-4">
            <div>
              <div class="text-xs font-semibold text-slate-500">Total Active</div>
              <div id="totalActive" class="text-2xl font-extrabold text-violet-800">0</div>
            </div>
            <div class="rounded-xl bg-slate-50 p-2 text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
                <path fill-rule="evenodd"
                  d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v1h16V7a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zM18 9H2v7a2 2 0 002 2h12a2 2 0 002-2V9z"
                  clip-rule="evenodd" />
              </svg>
            </div>
          </div>

          <div class="mt-4">
            <div class="text-xs font-semibold text-slate-700">Filter by Due Date Range</div>
            <div class="mt-2 grid grid-cols-1 gap-3 sm:grid-cols-2">
              <div>
                <div class="text-[11px] text-slate-500">From</div>
                <input id="fromDate" type="date"
                  class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm outline-none focus:border-violet-400" />
              </div>
              <div>
                <div class="text-[11px] text-slate-500">To</div>
                <input id="toDate" type="date"
                  class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm outline-none focus:border-violet-400" />
              </div>
            </div>
          </div>
        </div>

        <div id="activeLoansList" class="mt-5 space-y-4"></div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="/scripts/pages/active.js"></script>
</body>

</html>
